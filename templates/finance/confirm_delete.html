{% extends 'finance/base.html' %}

{% block title %}Delete {{ type|title }} - MoneyFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <div class="rounded-circle p-4 d-inline-block" style="background: rgba(236, 72, 153, 0.1);">
                        <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
                    </div>
                </div>
                
                <h4 class="mb-3">Delete {{ type|title }}?</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to delete this {{ type }}? This action cannot be undone.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash me-2"></i>Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
